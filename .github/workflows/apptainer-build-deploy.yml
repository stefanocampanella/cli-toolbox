name: Build and Deploy Apptainer Images

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Apptainer Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            def_file: recipes/toolbox.def
            sif_file: toolbox.sif
            tag: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            def_file: recipes/toolbox-arm64.def
            sif_file: toolbox-arm64.sif
            tag: arm64
    container:
      image: ghcr.io/apptainer/apptainer:latest
      options: --privileged
    steps:
      - name: Check out code for the container builds
        uses: actions/checkout@v4

      - name: Build Container
        run: |
          apptainer build ${{ matrix.sif_file }} ${{ matrix.def_file }}

      - name: Login and Deploy Container
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login -u "${{ github.actor }}" --password-stdin oras://ghcr.io
          IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          apptainer push ${{ matrix.sif_file }} "oras://ghcr.io/${IMAGE_REPO}:${{ matrix.tag }}"
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            apptainer push ${{ matrix.sif_file }} "oras://ghcr.io/${IMAGE_REPO}:latest"
          fi